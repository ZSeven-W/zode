name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate platform desktop screenshot goldens as artifacts
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: verify desktop workflow and packaging contracts
        run: |
          ./scripts/test-app-workflows.sh
          ./scripts/test-build-app-release.sh
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install skia text dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libfontconfig1-dev libfreetype6-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        env:
          ZODE_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots && '1' || '0' }}
        run: cargo test --locked --workspace
      - name: render desktop reference
        run: cargo run -p zode-app -- --render-snapshot target/zode-shell-reference.png
      - name: upload desktop reference
        uses: actions/upload-artifact@v4
        with:
          name: zode-shell-reference
          path: target/zode-shell-reference.png
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: verify arm64 runner
        run: test "$(uname -m)" = arm64
      - name: verify native macOS packaging contract
        run: ./scripts/test-build-app-release.sh
      - name: test desktop app
        run: cargo test --locked -p zode-app --all-targets
      - name: build desktop app
        run: cargo build --locked -p zode-app
      - name: upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: zode-app-macos-arm64
          path: target/debug/zode-app

  verify-snapshots:
    name: verify-snapshots-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshot-verify-${{ matrix.platform }}
      - name: Install Linux Skia text dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - name: Verify checked-in desktop screenshot goldens
        run: cargo test --locked -p zode-app --test snapshots

  portable-core:
    name: portable-core-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-15
            target: aarch64-apple-ios
          - platform: android
            os: ubuntu-24.04
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.target }}
      - name: Install portable target explicitly
        run: rustup target add --toolchain 1.94.0 "${{ matrix.target }}"
      - name: Check portable protocol, model, and UI crates
        run: >-
          cargo +1.94.0 check --locked
          -p zode-node-protocol -p zode-app-model -p zode-app-ui
          --target ${{ matrix.target }}

  update-snapshots:
    if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
    name: update-snapshots-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshot-${{ matrix.platform }}
      - name: Install Linux Skia text dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - name: Generate platform screenshot goldens
        env:
          ZODE_UPDATE_SNAPSHOTS: "1"
        run: cargo test --locked -p zode-app --test snapshots
      - name: Upload platform screenshot goldens
        uses: actions/upload-artifact@v4
        with:
          name: zode-app-snapshots-${{ matrix.platform }}
          path: crates/zode-app/tests/snapshots/${{ matrix.platform }}/*.png
          if-no-files-found: error

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Build the server once and hand every SDK its path, so each language's
      # e2e contract runs against the real binary. --strict turns a missing
      # toolchain into a failure instead of a silent skip.
      - name: build zode
        run: cargo build -p zode
      - name: sdk suites
        run: ZODE_BIN="$PWD/target/debug/zode" bash scripts/test-sdks.sh --strict

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      # `build --workspace` above proves the whole product compiles on Windows.
      # The runtime test run is scoped to the sandbox module: zode's broader
      # suite has pre-existing Unix path/behavior assumptions (images, mcp,
      # noema, engine, fs_escalate) whose Windows-greenness is separate,
      # tracked debt — not part of the Windows Tier 1 sandbox feature.
      - name: test
        run: "cargo test -p zode-core sandbox::"
      # windows-latest runs with an Administrator account; the ignored suite
      # creates a per-user AppContainer and tears it down via a Drop guard even
      # when an assertion fails.
      - name: Windows Tier 1 and Tier 2 sandbox integration tests
        env:
          ZODE_SANDBOX_IT: "1"
        run: cargo test -p zode-core --features sandbox-test-runner --test windows-sandbox-it -- --ignored
