name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.pkg-suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            pkg-suffix: arm64-mac
          # macos-13 (Intel) runners are retired; cross-compile the x86_64
          # slice on the arm64 macos-14 runner (Apple's clang targets both
          # arches natively, so aws-lc-sys / zstd-sys build cleanly).
          - os: macos-14
            target: x86_64-apple-darwin
            pkg-suffix: x64-mac
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg-suffix: x64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg-suffix: arm64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg-suffix: x64-windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pkg-suffix: arm64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # aws-lc-sys (via rustls) needs NASM to assemble its x86_64 crypto on
      # Windows MSVC. Native arm64 / unix toolchains don't need it.
      - name: Install NASM (x64 Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1
      - name: Compute package name
        shell: bash
        run: echo "PKG=zode-${GITHUB_REF_NAME#v}-${{ matrix.pkg-suffix }}" >> "$GITHUB_ENV"
      - name: Build + package
        shell: bash
        run: ./scripts/build-release.sh "${{ matrix.target }}" "$PKG"
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          # The platform archive plus the install scripts, so the release page
          # carries `curl | sh` / `irm | iex` installers alongside the binaries.
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
          fail_on_unmatched_files: true
          # Tags with a pre-release suffix (e.g. v0.1.0-beta.1) publish as a
          # GitHub pre-release; plain vX.Y.Z tags publish as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Fixed body (same across all matrix jobs → no duplication). Update
          # RELEASE_NOTES.md per release.
          body_path: RELEASE_NOTES.md
