name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the release ONCE before the build fan-out. Six matrix jobs racing
  # "create if absent" let GitHub mint duplicate same-tag DRAFTS, and any
  # later finalize PATCH then dies with `already_exists` (seen in beta.4).
  # With the release pre-created, softprops only ever uploads to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists — reusing"
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $prerelease

  sdk-rust-release:
    needs: create-release
    name: sdk-rust-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test and package Rust SDK
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$actual" = "$version"
          cargo test -p zode-sdk-rust --locked
          ./scripts/package-rust-sdk.sh "$version" \
            "sdk-dist/zode-sdk-rust-$version.tar.gz"
          verify_dir="$(mktemp -d)"
          tar -xzf "sdk-dist/zode-sdk-rust-$version.tar.gz" -C "$verify_dir"
          cargo test --workspace \
            --manifest-path "$verify_dir/zode-sdk-rust-$version/Cargo.toml"
      - name: Publish Rust SDK bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: sdk-dist/*.tar.gz
          fail_on_unmatched_files: true

  sdk-typescript-package:
    needs: create-release
    name: sdk-typescript-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@zseven-w"
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Build and test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          pnpm install --frozen-lockfile
          pnpm test
      - name: Publish TypeScript SDK to GitHub Packages
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@zseven-w/zode-sdk@$version" version \
            --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@zseven-w/zode-sdk@$version already published — reusing"
          else
            npm publish --tag beta
          fi

  sdk-python-release:
    needs: create-release
    name: sdk-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and package Python SDK
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="${version/-beta./b}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml", "rb"))["project"]["version"])')"
          test "$actual" = "$expected"
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build sdk/python
      - name: Publish Python SDK archives to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
          fail_on_unmatched_files: true

  sdk-go-module:
    needs: create-release
    name: sdk-go-module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.mod
      - name: Test Go SDK
        working-directory: sdk/go
        run: go test ./...
      - name: Publish Go module tag
        run: |
          tag="sdk/go/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" \
            >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            remote_sha="$(git rev-list -n 1 "$tag")"
            test "$remote_sha" = "$GITHUB_SHA"
            echo "$tag already points to $GITHUB_SHA — reusing"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  sdk-kotlin-package:
    needs: create-release
    name: sdk-kotlin-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test and publish Kotlin SDK to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "version = \"$version\"" sdk/kotlin/build.gradle.kts
          gradle -p sdk/kotlin test
          pom="https://maven.pkg.github.com/zseven-w/zode/com/zseven/zode/zode-sdk/$version/zode-sdk-$version.pom"
          if curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$pom" >/dev/null 2>&1; then
            echo "com.zseven.zode:zode-sdk:$version already published — reusing"
          else
            gradle -p sdk/kotlin publish
          fi

  browser-extension:
    needs: create-release
    name: browser-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/chrome/package-lock.json
      - name: Install extension dependencies
        working-directory: extensions/chrome
        run: npm ci
      - name: Build and test extension
        working-directory: extensions/chrome
        run: npm test
      - name: Package extension
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-browser-extension.sh "dist/zode-browser-bridge-$version.zip"
      - name: Publish extension to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zode-browser-bridge-*.zip
          fail_on_unmatched_files: true

  build:
    needs: create-release
    name: ${{ matrix.pkg-suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            pkg-suffix: arm64-mac
          # macos-13 (Intel) runners are retired; cross-compile the x86_64
          # slice on the arm64 macos-14 runner (Apple's clang targets both
          # arches natively, so aws-lc-sys / zstd-sys build cleanly).
          - os: macos-14
            target: x86_64-apple-darwin
            pkg-suffix: x64-mac
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg-suffix: x64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg-suffix: arm64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg-suffix: x64-windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pkg-suffix: arm64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # aws-lc-sys (via rustls) needs NASM to assemble its x86_64 crypto on
      # Windows MSVC. Native arm64 / unix toolchains don't need it.
      - name: Install NASM (x64 Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1
      - name: Compute package name
        shell: bash
        run: echo "PKG=zode-${GITHUB_REF_NAME#v}-${{ matrix.pkg-suffix }}" >> "$GITHUB_ENV"
      - name: Build + package
        shell: bash
        run: ./scripts/build-release.sh "${{ matrix.target }}" "$PKG"
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          # The platform archive plus the install scripts, so the release page
          # carries `curl | sh` / `irm | iex` installers alongside the binaries.
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
          fail_on_unmatched_files: true
          # Title/body/prerelease are set by the create-release job (once);
          # this step ONLY uploads assets to that existing release.

  build-desktop:
    needs: create-release
    name: desktop-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig1-dev libfreetype6-dev
      - name: Install NASM (x64 Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Install WiX Toolset v4
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build native desktop package
        shell: bash
        run: >-
          ./scripts/build-app-release.sh
          --target "${{ matrix.target }}"
          --out dist-app
          --version "${GITHUB_REF_NAME#v}"
      - name: Collect release assets
        shell: bash
        run: |
          mkdir release-assets
          case "${{ matrix.target }}" in
            *-apple-darwin)
              cp dist-app/zode-desktop-*.tar.gz release-assets/
              ;;
            *-pc-windows-msvc)
              cp dist-app/zode-desktop-*.zip dist-app/zode-desktop-*.msi release-assets/
              ;;
            *-unknown-linux-gnu)
              cp dist-app/zode-desktop-*.AppImage dist-app/zode-desktop-*.tar.gz release-assets/
              ;;
          esac
          cp dist-app/zode-desktop-*.sha256 release-assets/
      - name: Publish desktop assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
