[package]
name = "zode-overlay"
description = "Ghost-cursor overlay helper for zode desktop automation (macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The `objc` 0.2 `sel!`/`msg_send!` macros expand a `cfg(feature =
# "cargo-clippy")` gate into this crate; declare it expected so the
# unexpected_cfgs lint stays useful without failing `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra"] }
foreign-types = "0.5"
