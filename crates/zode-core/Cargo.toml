[package]
name = "zode-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
agent = { workspace = true }
agent-tools-code = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Order-preserving map so the `providers` config keeps the user's file order
# (the first entry is the default when no provider is explicitly selected).
indexmap = { version = "2", features = ["serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
chromiumoxide = { workspace = true }
noema-core = { path = "../../vendor/noema/crates/noema-core", default-features = false, optional = true }
rquickjs = { version = "0.12", features = ["futures", "parallel"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[features]
default = ["noema"]
noema = ["dep:noema-core"]
sandbox-test-runner = []
