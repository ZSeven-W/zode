[package]
name = "cordis-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZSeven-W/zode"
description = "Cordis-inspired plugin harness for Rust: scoped services, fiber-owned cleanup, and a bounded memory budget"
keywords = ["plugin", "harness", "dependency-injection", "event", "service"]
