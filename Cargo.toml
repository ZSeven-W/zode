[workspace]
resolver = "2"
members = [
  "crates/zode",
  "crates/zode-core",
  "crates/zode-tui",
  "crates/zode-overlay",
  "crates/zode-app-server-protocol",
  "crates/zode-app-server-transport",
  "crates/zode-app-server",
  "crates/zode-pty-harness",
  "crates/zode-node-protocol",
  "crates/zode-app-model",
  "crates/zode-app-runtime",
  "crates/zode-app-ui",
  "crates/zode-app",
  "sdk/rust",
]
# Vendored projects are independent workspaces; keep them out of Zode's so
# their crates resolve `*.workspace = true` against their own roots.
exclude = ["vendor/agent", "vendor/noema", "vendor/jian", "vendor/casement"]

[workspace.package]
version = "0.1.0-beta.7"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZSeven-W/zode"
authors = ["ZSeven-W <fini.yang@gmail.com>"]

[workspace.dependencies]
# agent-rs (vendored). `full` pulls anthropic + openai + ollama + mcp +
# session-jsonl + swarm + tiktoken so every Zode phase has what it needs.
agent = { path = "vendor/agent/crates/agent", features = ["full"] }
# `all` = fs + shell + bash-async + search + web + web-search + todo + notebook + task.
# Zode ships the full tool surface (no M0 simplification).
agent-tools-code = { path = "vendor/agent/crates/agent-tools-code", features = ["all"] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "process",
  "sync",
  "time",
  "fs",
  "signal",
] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = "0.24"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
fs4 = "0.9"
sha2 = "0.10"
agent-client-protocol = { version = "1.2.0", features = ["unstable_session_fork"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
hmac = "0.12"
libc = "0.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
serial_test = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chromiumoxide = { version = "0.9", default-features = true }
portable-pty = "0.9"
vt100 = "0.15"

jian-core = { path = "vendor/jian/crates/jian-core", version = "0.0.1" }
jian-widgets = { path = "vendor/jian/crates/jian-widgets", version = "0.0.1" }
jian-skia = { path = "vendor/jian/crates/jian-skia", version = "0.0.1", features = ["textlayout"] }
skia-safe = "0.97.0"
casement = { path = "vendor/casement", version = "0.30.13" }
glutin = "0.32"
softbuffer = "0.4"
accesskit = "0.24"
# accesskit_winit hard-depends on crates.io winit, whose Window types are
# incompatible with the casement fork. Platform adapters avoid a second winit.
accesskit_macos = "0.26"
accesskit_windows = "0.33"
accesskit_unix = "0.22"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString"] }
x11rb = { version = "0.13.2", features = ["randr"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
futures-core = "0.3"
fs2 = "0.4"
nix = { version = "0.28", features = ["fs", "process", "signal"] }
portable-pty = "0.9"
vte = "0.13"
rfd = "0.15"
open = "5"
notify-rust = "=4.11.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
