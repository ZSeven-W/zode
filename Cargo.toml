[workspace]
resolver = "2"
members = ["crates/zode", "crates/zode-core", "crates/zode-tui"]
# vendor/agent is its own (agent-rs) workspace; keep it out of ours so its
# crates resolve `*.workspace = true` against agent-rs's root, not zode's.
exclude = ["vendor/agent", "vendor/noema"]

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ZSeven-W/zode"
authors = ["ZSeven-W <fini.yang@gmail.com>"]

[workspace.dependencies]
# agent-rs (vendored). `full` pulls anthropic + openai + ollama + mcp +
# session-jsonl + swarm + tiktoken so every Zode phase has what it needs.
agent = { path = "vendor/agent/crates/agent", features = ["full"] }
# `all` = fs + shell + bash-async + search + web + web-search + todo + notebook + task.
# Zode ships the full tool surface (no M0 simplification).
agent-tools-code = { path = "vendor/agent/crates/agent-tools-code", features = ["all"] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "process",
  "sync",
  "time",
  "fs",
  "signal",
] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = "0.24"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
serial_test = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
chromiumoxide = { version = "0.9", default-features = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
