<!doctype html>
<meta charset="utf-8">
<title>Pair zode with Chrome</title>
<body>
  <main class="shell">
    <header class="brand">
      <img class="mark" src="icons/zode-48.png" alt="" aria-hidden="true">
      <h1>Pair zode with Chrome</h1>
      <p>This page is only used to pair or reconnect the local browser bridge.</p>
    </header>

    <section class="panel" aria-labelledby="pairing-title">
      <h2 id="pairing-title">Local bridge</h2>
      <label>
        <span>WS port</span>
        <input id="port" inputmode="numeric" autocomplete="off" placeholder="from /browser pair">
      </label>
      <label>
        <span>Pairing code</span>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digits">
      </label>
      <button id="go" type="button">Pair / Reconnect</button>
      <p id="form-status" class="meta" role="status" aria-live="polite">Not connected</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
<style>
  :root {
    color-scheme: light dark;
    font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #202124;
    background: #fff;
  }

  body {
    margin: 0;
    min-width: 360px;
    background: #fff;
  }

  .shell {
    box-sizing: border-box;
    display: grid;
    gap: 14px;
    padding: 18px 16px 16px;
  }

  .brand {
    display: grid;
    justify-items: center;
    gap: 8px;
    text-align: center;
  }

  .brand p,
  .meta {
    color: #687078;
    margin: 0;
  }

  .mark {
    display: block;
    width: 38px;
    height: 38px;
  }

  h1 {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.2;
    margin: 0;
  }

  h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
  }

  .panel {
    border: 1px solid #e0e3e7;
    border-radius: 8px;
    background: #fbfbfc;
    box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    display: grid;
    gap: 10px;
    padding: 12px;
  }

  label {
    color: #3c4043;
    display: grid;
    font-size: 12px;
    gap: 5px;
  }

  input,
  button {
    box-sizing: border-box;
    font: inherit;
    width: 100%;
  }

  input {
    background: #fff;
    border: 1px solid #c7ccd1;
    border-radius: 6px;
    min-height: 34px;
    padding: 7px 9px;
  }

  input:focus {
    border-color: #1a73e8;
    outline: 2px solid rgba(26, 115, 232, 0.14);
  }

  #go {
    background: #202124;
    border: 0;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    min-height: 36px;
    padding: 8px 10px;
  }

  #go:disabled {
    cursor: default;
    opacity: 0.62;
  }

  .meta {
    font-size: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root,
    body {
      background: #202124;
      color: #f1f3f4;
    }

    .panel {
      background: #282a2d;
      border-color: #3c4043;
    }

    label,
    .brand p {
      color: #d4d7db;
    }

    .meta {
      color: #aeb4ba;
    }

    input {
      background: #202124;
      border-color: #5f6368;
      color: #f1f3f4;
    }

    #go {
      background: #e8eaed;
      color: #202124;
    }
  }
</style>
