<!doctype html>
<meta charset="utf-8">
<title>zode bridge</title>
<body>
  <main class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true">z</div>
      <h1>zode</h1>
    </header>

    <section id="connected-view" class="panel" hidden>
      <div class="panel-top">
        <span id="status-pill" class="pill">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Connected</span>
        </span>
        <button class="icon-button" type="button" title="Bridge settings" aria-label="Bridge settings">&#9881;</button>
      </div>
      <p class="copy">Control Chrome with zode.</p>
      <p id="status-detail" class="meta"></p>
      <p id="version" class="meta"></p>
    </section>

    <section id="connect-view" class="panel">
      <div class="panel-top">
        <span class="pill muted">
          <span class="dot" aria-hidden="true"></span>
          <span>Not connected</span>
        </span>
      </div>
      <label>
        <span>WS port</span>
        <input id="port" inputmode="numeric" autocomplete="off" placeholder="from /browser pair">
      </label>
      <label>
        <span>Pairing code</span>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digits">
      </label>
      <button id="go" type="button">Pair / Reconnect</button>
      <p id="form-status" class="meta" role="status">Not connected</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
<style>
  :root {
    color-scheme: light dark;
    font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #202124;
    background: #fff;
  }

  body {
    margin: 0;
    min-width: 360px;
    background: #fff;
  }

  .shell {
    box-sizing: border-box;
    display: grid;
    gap: 14px;
    padding: 18px 16px 16px;
  }

  .brand {
    display: grid;
    justify-items: center;
    gap: 8px;
  }

  .mark {
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border: 1px solid #dadce0;
    border-radius: 50%;
    color: #3c4043;
    font-weight: 650;
    font-size: 16px;
  }

  h1 {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.2;
    margin: 0;
  }

  .panel {
    border: 1px solid #e0e3e7;
    border-radius: 8px;
    background: #fbfbfc;
    box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    display: grid;
    gap: 10px;
    padding: 12px;
  }

  .panel-top {
    align-items: center;
    display: flex;
    justify-content: space-between;
    min-height: 26px;
  }

  .pill {
    align-items: center;
    background: #e7f5ec;
    border-radius: 999px;
    color: #137333;
    display: inline-flex;
    font-size: 13px;
    gap: 7px;
    line-height: 1;
    padding: 6px 10px;
  }

  .pill.muted {
    background: #f1f3f4;
    color: #5f6368;
  }

  .dot {
    background: currentColor;
    border-radius: 50%;
    height: 6px;
    width: 6px;
  }

  .icon-button {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 50%;
    color: #6b7178;
    display: inline-grid;
    font-size: 14px;
    height: 28px;
    justify-content: center;
    padding: 0;
    width: 28px;
  }

  .icon-button:hover {
    background: #eef0f2;
  }

  .copy,
  .meta {
    margin: 0;
  }

  .copy {
    color: #687078;
  }

  .meta {
    color: #777f87;
    font-size: 12px;
  }

  label {
    color: #3c4043;
    display: grid;
    font-size: 12px;
    gap: 5px;
  }

  input,
  button {
    box-sizing: border-box;
    font: inherit;
    width: 100%;
  }

  input {
    background: #fff;
    border: 1px solid #c7ccd1;
    border-radius: 6px;
    min-height: 34px;
    padding: 7px 9px;
  }

  input:focus {
    border-color: #1a73e8;
    outline: 2px solid rgba(26, 115, 232, 0.14);
  }

  #go {
    background: #202124;
    border: 0;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    min-height: 36px;
    padding: 8px 10px;
  }

  #go:disabled {
    cursor: default;
    opacity: 0.62;
  }

  @media (prefers-color-scheme: dark) {
    :root,
    body {
      background: #202124;
      color: #f1f3f4;
    }

    .panel {
      background: #282a2d;
      border-color: #3c4043;
    }

    .mark {
      border-color: #5f6368;
      color: #f1f3f4;
    }

    label,
    .copy {
      color: #d4d7db;
    }

    .meta {
      color: #aeb4ba;
    }

    input {
      background: #202124;
      border-color: #5f6368;
      color: #f1f3f4;
    }

    #go {
      background: #e8eaed;
      color: #202124;
    }
  }
</style>
