<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>zode tasks</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="panel-app">
      <header class="panel-header">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">Z</div>
          <div class="brand-copy">
            <h1 id="panel-title">zode</h1>
            <p id="connection-status" class="connection-status" role="status" aria-live="polite">
              正在连接…
            </p>
          </div>
          <p id="workspace-label" class="workspace-label" title="No workspace">No workspace</p>
        </div>

        <div class="task-bar" aria-label="Task controls">
          <label class="sr-only" for="task-menu">Select task</label>
          <select id="task-menu" class="task-menu" aria-label="Select task">
            <option value="">No tasks</option>
          </select>
          <button id="new-task-button" class="icon-button" type="button" aria-label="New task">
            <span aria-hidden="true">＋</span>
          </button>
          <button
            id="more-button"
            class="icon-button"
            type="button"
            aria-label="More task actions"
            title="More task actions"
            hidden
            disabled
          >
            <span aria-hidden="true">•••</span>
          </button>
        </div>
      </header>

      <div id="connection-banner" class="connection-banner" role="note">
        <span id="connection-banner-message">
          启动 zode 并运行 /browser pair 以连接任务客户端。
        </span>
        <button
          id="retry-button"
          class="retry-button"
          type="button"
          aria-label="Retry connection"
        >
          重试
        </button>
      </div>

      <main id="message-stream" class="message-stream" aria-labelledby="panel-title">
        <section id="empty-state" class="empty-state" aria-labelledby="empty-state-title">
          <div class="empty-orbit" aria-hidden="true"><span>Z</span></div>
          <p class="eyebrow">Tasks</p>
          <h2 id="empty-state-title">从这里派发任务</h2>
          <p>新建或选择任务，然后让 zode 在共享会话中持续工作。</p>
        </section>

        <section id="message-list" class="message-list" aria-label="Task messages"></section>
        <section id="tool-region" class="tool-region" aria-label="Tool activity" hidden></section>
        <section
          id="approval-region"
          class="approval-region"
          aria-label="Approval requests"
          hidden
        ></section>
        <section
          id="error-region"
          class="error-region"
          aria-label="Task status and errors"
          aria-live="polite"
          hidden
        ></section>
      </main>

      <footer id="composer-region" class="composer-region">
        <form id="composer-form" class="composer-card">
          <label class="sr-only" for="composer">Task message</label>
          <textarea
            id="composer"
            rows="3"
            aria-label="Task message"
            placeholder="Ask zode to work on this task…"
          ></textarea>

          <input
            id="attachment-input"
            type="file"
            multiple
            hidden
            accept="image/png,image/jpeg,image/gif,image/webp,text/*,.rs,.js,.ts,.tsx,.jsx,.json,.md,.toml,.yaml,.yml,.css,.html,.sh,.py,.go,.java,.kt"
            aria-label="Choose files to attach"
          />
          <div
            id="attachment-list"
            class="attachment-list"
            aria-label="Selected attachments"
            hidden
          ></div>
          <p
            id="attachment-status"
            class="attachment-status"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <div class="composer-toolbar">
            <button
              id="attach-button"
              class="icon-button attach-button"
              type="button"
              aria-label="Attach files"
              title="Attach files"
            >
              <span aria-hidden="true">＋</span>
            </button>

            <label class="select-chip access-chip">
              <span>Access</span>
              <select id="access-select" aria-label="Task access">
                <option value="readOnly">Read only</option>
                <option value="prompt" selected>Prompt</option>
                <option value="auto">Auto</option>
              </select>
            </label>

            <label class="select-chip model-chip">
              <span>Model</span>
              <select id="model-select" aria-label="Task model">
                <option value="">Default</option>
              </select>
            </label>

            <button id="send-button" class="send-button" type="submit" aria-label="Send task">
              Send
            </button>
          </div>
        </form>
      </footer>
    </div>

    <script src="sidepanel-state.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
