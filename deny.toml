[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # backoff 0.4.0 / instant 0.1.13 — unmaintained, pulled transitively via
  # async-openai 0.36 (agent crate `openai` feature). Same ignores as agent-rs.
  "RUSTSEC-2025-0012",
  "RUSTSEC-2024-0384",
  # bincode unmaintained — transitive only; no exposed API risk. Re-evaluate
  # when the upstream dep drops/updates it.
  "RUSTSEC-2025-0141",
  # paste unmaintained — transitive via ratatui (proc-macro helper, build-time
  # only, no runtime surface).
  "RUSTSEC-2024-0436",
  # yaml-rust unmaintained — transitive via syntect (parses bundled syntax
  # definitions at startup; inputs are the shipped defaults, not user data).
  "RUSTSEC-2024-0320",
  # quick-xml 0.39 DoS-class parser issues (quadratic dup-attribute check /
  # unbounded xmlns allocation). Transitive via syntect → plist, which only
  # parses zode's BUNDLED .tmTheme assets — never attacker-supplied XML. The
  # fix needs quick-xml >= 0.41, which plist 1.9 doesn't yet allow;
  # re-evaluate when plist bumps its bound.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # proc-macro-error2 unmaintained — build-time only through jieba-rs'
  # compressed default dictionary generator. The default dictionary is required
  # for noema's CJK tokenization behavior; re-evaluate when jieba-rs drops
  # include-flate-codegen or offers an equivalent maintained dictionary path.
  "RUSTSEC-2026-0173",
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0", # webpki-root-certs (transitive via reqwest/rustls)
  "BSL-1.0",             # ryu / clipboard-win (transitive via ratatui/time) — permissive Boost license
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps (zode-core/zode-tui + vendored agent crates) have no
# version field; that's a local path, not a real wildcard from the registry.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
