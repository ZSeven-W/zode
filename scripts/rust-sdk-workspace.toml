[workspace]
resolver = "2"
members = [
  "crates/zode-app-server-protocol",
  "sdk/rust",
]

[workspace.package]
version = "@VERSION@"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ZSeven-W/zode"
authors = ["ZSeven-W <fini.yang@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "process",
  "sync",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tempfile = "3"
